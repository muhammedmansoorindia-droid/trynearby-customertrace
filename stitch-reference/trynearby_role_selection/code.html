  <p class="font-body-md text-body-md text-on-surface-variant max-w-xs">
    Select your portal to continue

</header>

<!-- 3 Big Prominent Buttons -->
<div class="flex flex-col gap-space-md w-full max-w-md mx-auto pt-space-sm">
  <!-- 1. Try Nearby (Admin / Main Portal) -->
  <button type="button" class="w-full flex items-center justify-between p-space-lg rounded-xl bg-primary text-on-primary hover:bg-tertiary-container shadow-sm hover:shadow-md active:scale-[0.99] transition-all duration-200 text-left group">
    <div class="flex items-center gap-space-md">
      <div class="w-12 h-12 rounded-xl bg-surface/20 flex items-center justify-center text-on-primary flex-shrink-0">
        <span class="material-symbols-outlined text-[28px]">explore</span>
      </div>
      <div class="flex flex-col">
        <span class="font-headline-sm text-headline-sm font-bold text-on-primary tracking-tight">TryNearby</span>
        <span class="font-body-sm text-body-sm text-on-primary/80">Main platform &amp; exploration</span>
      </div>
    </div>
    <span class="material-symbols-outlined text-[24px] text-on-primary group-hover:translate-x-1 transition-transform">arrow_forward</span>
  </button>

  <!-- 2. Restaurant Portal -->
  <button type="button" class="w-full flex items-center justify-between p-space-lg rounded-xl bg-surface-container-lowest text-on-surface hover:bg-surface-container-high shadow-sm hover:shadow-md active:scale-[0.99] transition-all duration-200 text-left group border border-outline-variant/30">
    <div class="flex items-center gap-space-md">
      <div class="w-12 h-12 rounded-xl bg-secondary-container flex items-center justify-center text-secondary flex-shrink-0">
        <span class="material-symbols-outlined text-[28px]">restaurant</span>
      </div>
      <div class="flex flex-col">
        <span class="font-headline-sm text-headline-sm font-bold text-on-surface tracking-tight">Restaurant</span>
        <span class="font-body-sm text-body-sm text-on-surface-variant">Partners, offers &amp; redemptions</span>
      </div>
    </div>
    <span class="material-symbols-outlined text-[24px] text-on-surface-variant group-hover:translate-x-1 transition-transform">arrow_forward</span>
  </button>

  <!-- 3. Creator Portal -->
  <button type="button" class="w-full flex items-center justify-between p-space-lg rounded-xl bg-surface-container-lowest text-on-surface hover:bg-surface-container-high shadow-sm hover:shadow-md active:scale-[0.99] transition-all duration-200 text-left group border border-outline-variant/30">
    <div class="flex items-center gap-space-md">
      <div class="w-12 h-12 rounded-xl bg-tertiary-fixed flex items-center justify-center text-tertiary flex-shrink-0">

        <span class="font-headline-sm text-headline-sm font-bold text-on-surface tracking-tight">Creator</span>

  </button>
</div>

<!-- Subtle Status Footer -->
<footer class="mt-space-xl flex flex-col items-center gap-space-xs text-center pb-space-lg">
  <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-secondary-container text-on-secondary-fixed font-label-sm text-label-sm shadow-sm">
    <span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
    <span class="">Quick Access Demo</span>
  </div>
</footer></div>
<script>
  // Add interactive tap feedback for roles
  document.querySelectorAll('article button').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const cardTitle = e.currentTarget.closest('article').querySelector('h2').innerText;
      const originalText = e.currentTarget.innerHTML;
      e.currentTarget.innerHTML = `<span class="material-symbols-outlined animate-spin text-[18px]">progress_activity</span><span>Launching ${cardTitle}...</span>`;
      setTimeout(() => {
        e.currentTarget.innerHTML = originalText;
      }, 900);
    });
  });
</script></main>
